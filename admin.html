<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>VH Admin</title>
<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VH Admin">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070d; --blue:#5b8cff; --cyan:#4fd1ff; --gold:#d4af37;
  --text:#f2f5fb; --muted:#8b93a7; --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.09);
}
*{
  box-sizing:border-box;
  margin:0;
  -webkit-tap-highlight-color:transparent;
  user-select: none; 
  -webkit-user-select: none;
}
html,body{height:100%; overscroll-behavior-y: none; background: var(--bg);}
body{
  background:radial-gradient(900px 500px at 15% -10%,rgba(91,140,255,.18),transparent 60%),
             radial-gradient(700px 420px at 100% 0%,rgba(79,209,255,.10),transparent 60%),var(--bg);
  color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 20px);
  display:flex;justify-content:center;
  position: fixed; 
  width: 100%;
}
.app{width:100%;max-width:480px;display:flex;flex-direction:column;min-height:100%;gap:22px; overflow-y: auto; padding-bottom: 20px;}

header{display:flex;align-items:center;gap:14px; margin-bottom: 10px;}
.logo{width:48px;height:48px;border-radius:14px;background:#0a0e18;border:1px solid rgba(212,175,55,.35);
  display:grid;place-items:center;color:var(--gold);font-weight:700;font-size:18px;letter-spacing:.5px;flex:none}
h1{font-size:24px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
h1 small{display:block;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:4px}

.section-title {font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 600; margin-top: 10px; margin-bottom: -10px;}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.tile{
  position:relative;aspect-ratio:1/1;border-radius:24px;padding:18px;text-decoration:none;color:var(--text);
  background:var(--card);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  display:flex;flex-direction:column;justify-content:space-between;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,background .25s;
}
.tile:active{transform:scale(.95); background: rgba(255,255,255,.1);}
.tile svg{width:28px;height:28px;stroke:var(--cyan);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile:nth-child(2) svg{stroke:var(--blue)}
.tile b{font-size:16px;font-weight:600;letter-spacing:-.01em;display:block}
.tile span{font-size:12px;color:var(--muted);display:block;margin-top:2px}

footer{margin-top:auto;text-align: center; color: var(--muted); font-size: 13px; padding-top: 20px;}
footer a {color: var(--blue); text-decoration: none;}

#install{display:none;border:1px solid rgba(255,255,255,.12);background:transparent;color:var(--muted);font:inherit;font-size:13px;
  padding:12px;border-radius:14px;cursor:pointer; margin-top: 10px;}
a:focus-visible,button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="logo" aria-hidden="true">VH</div>
    <h1>Admin App<small>Jouw persoonlijke commandocentrum</small></h1>
  </header>

  <div class="section-title">Zakelijk Beheer</div>
  <nav class="grid" aria-label="Zakelijke tools">
    <a class="tile" href="offerte.html">
      <svg viewBox="0 0 24 24"><path d="M5 3h14v18l-2.5-1.8L14 21l-2-1.8L10 21l-2.5-1.8L5 21z"/><path d="M9 8h6M9 12h6"/></svg>
      <div><b>Offerte</b><span>Voorstel maken</span></div>
    </a>
    <a class="tile" href="factuur.html">
      <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
      <div><b>Factuur</b><span>Versturen</span></div>
    </a>
    <a class="tile" href="klantenbeheer.html">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      <div><b>Klanten</b><span>CRM Database</span></div>
    </a>
    <a class="tile" href="projecten.html">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      <div><b>Projecten</b><span>Kanban Bord</span></div>
    </a>
    <a class="tile" href="uren-tracker.html">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>
      <div><b>Timer</b><span>Uren bijhouden</span></div>
    </a>
    <a class="tile" href="dashboard.html">
      <svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <div><b>Dashboard</b><span>Volledig overzicht</span></div>
    </a>
  </nav>

  <div class="section-title">Techniek & Hosting</div>
  <nav class="grid" aria-label="Technische tools">
    <a class="tile" href="https://github.com/driesaassmi-creator/verde-horizonte" target="_blank">
      <svg viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
      <div><b>GitHub</b><span>Broncode</span></div>
    </a>
    <a class="tile" href="https://vercel.com/dashboard" target="_blank">
      <svg viewBox="0 0 24 24"><polygon points="12 2 22 22 2 22"></polygon></svg>
      <div><b>Vercel</b><span>Hosting</span></div>
    </a>
  </nav>

  <button id="install" type="button">App installeren op beginscherm</button>

  <footer>
    Verde Horizonte &copy; 2026
  </footer>
</main>

<script>
/* Installeren */
let deferred;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; document.getElementById('install').style.display = 'block'; });
document.getElementById('install').addEventListener('click', async () => {
  if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; document.getElementById('install').style.display = 'none';
});
window.addEventListener('appinstalled', () => { document.getElementById('install').style.display = 'none'; });

/* Service worker (offline) */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* Haptics (trillen bij klikken) */
function haptic() { if (navigator.vibrate) navigator.vibrate(10); }
document.querySelectorAll('a, button').forEach(el => {
  el.addEventListener('touchstart', haptic, {passive: true});
});
</script>
</body>
</html>
