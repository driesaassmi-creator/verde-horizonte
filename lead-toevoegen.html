<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nieuwe Lead – Verde Horizonte Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:500px;margin:0 auto;}
  .form-group{margin-bottom:15px}
  .btn-primary{background:var(--accent);color:#05070d;padding:14px;border-radius:10px;font-weight:600;font-size:1rem;cursor:pointer;border:none;width:100%;font-family:inherit;margin-top:10px;}
  .btn-primary:hover{filter:brightness(1.1)}
  
  /* DE FIX VOOR HET LEGE VAK ONDERAAN */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(200%);
    background: var(--surface-2);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 14px 22px;
    border-radius: 12px;
    font-size: .95rem;
    font-weight: 500;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    z-index: 9999;
    transition: transform .35s ease;
    max-width: 90vw;
    visibility: hidden; /* Verbergt het element volledig */
    opacity: 0;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    visibility: visible;
    opacity: 1;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Nieuwe Lead</h1>
      <a href="admin.html">← Terug naar Admin</a>
    </div>

    <div class="card">
      <form id="lead-form">
        <div class="form-group"><label>Naam *</label><input type="text" id="name" required placeholder="Bijv. Jan Jansen"></div>
        <div class="form-group"><label>E-mailadres *</label><input type="email" id="email" required placeholder="jan@bedrijf.be"></div>
        <div class="form-group"><label>Bedrijf (optioneel)</label><input type="text" id="company" placeholder="Bedrijfsnaam"></div>
        <div class="form-group"><label>Notitie (optioneel)</label><textarea id="notes" placeholder="Waar hebben ze interesse in?"></textarea></div>
        <button type="submit" class="btn-primary">Voeg toe aan Klantenbeheer</button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const form = document.getElementById('lead-form');
    const toast = document.getElementById('toast');

    function showToast(msg, type='success'){
      toast.textContent = msg;
      toast.className = 'toast show ' + type;
      setTimeout(()=> toast.classList.remove('show'), 2800);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const company = document.getElementById('company').value.trim();
      const notes = document.getElementById('notes').value.trim();

      let customers = JSON.parse(localStorage.getItem('vh_customers')) || [];

      customers.push({
        id: Date.now(),
        name: name,
        email: email,
        company: company,
        phone: '',
        status: 'Prospect',
        notes: notes
      });

      localStorage.setItem('vh_customers', JSON.stringify(customers));

      showToast('Lead toegevoegd aan Klantenbeheer!', 'success');
      
      setTimeout(() => {
        window.location.href = 'klantenbeheer.html';
      }, 1500);
    });
  </script>
</body>
</html>
