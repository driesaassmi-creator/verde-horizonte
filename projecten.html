<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Projecten – Verde Horizonte Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .add-form{display:flex;gap:10px;margin-bottom:30px;background:var(--surface);padding:15px;border-radius:16px;border:1px solid var(--border);flex-wrap:wrap}
  .add-form input{flex:1;min-width:150px;padding:14px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:10px;font:inherit}
  .btn-add{padding:14px 24px;background:var(--accent);color:#000;font-weight:600;border:none;border-radius:10px;cursor:pointer;flex:1;min-width:100%;font-family:inherit}

  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .column{background:var(--surface-2);border-radius:16px;padding:15px;border:1px solid var(--border);min-height:200px}
  .column-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding-bottom:10px;border-bottom:1px solid var(--border)}
  .column-header h2{font-size:.9rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  .count{background:rgba(91,140,255,.1);color:var(--accent);padding:2px 8px;border-radius:10px;font-size:.8rem;font-weight:700}

  .task-list{display:flex;flex-direction:column;gap:12px}
  .task{background:var(--surface);border:1px solid var(--border);padding:15px;border-radius:12px;transition:all .2s}
  .task:hover{border-color:rgba(91,140,255,.4)}
  .task h3{font-size:1rem;margin-bottom:5px}
  .task p{font-size:.85rem;color:var(--muted);margin-bottom:15px}
  .task-actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn-move{padding:8px 12px;background:transparent;border:1px solid var(--border);color:var(--text);border-radius:8px;cursor:pointer;font-size:.8rem;flex:1;font-family:inherit}
  .btn-move:hover{background:rgba(91,140,255,.1);border-color:var(--accent)}
  .btn-delete{color:var(--danger);border-color:rgba(255,107,122,.3);flex:0}
  .btn-delete:hover{background:rgba(255,107,122,.1);border-color:var(--danger)}

  @media(max-width:768px){
    .add-form{flex-direction:column}
    .add-form input{width:100%}
    .btn-add{width:100%;min-width:100%}
    .board{grid-template-columns:1fr;gap:15px}
    .column{min-height:auto}
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Projecten <span style="color:var(--accent2)">Tracker</span></h1>
      <a href="admin.html">← Terug naar Admin</a>
    </div>

    <form class="add-form" id="task-form">
      <input type="text" id="task-name" placeholder="Projectnaam (bijv. Website Garage)" required>
      <input type="text" id="task-client" placeholder="Klantnaam" required>
      <button type="submit" class="btn-add">+ Toevoegen</button>
    </form>

    <div class="board">
      <div class="column">
        <div class="column-header"><h2>Te Doen</h2><span class="count" id="count-todo">0</span></div>
        <div class="task-list" id="list-todo"></div>
      </div>
      <div class="column">
        <div class="column-header"><h2>In Behandeling</h2><span class="count" id="count-doing">0</span></div>
        <div class="task-list" id="list-doing"></div>
      </div>
      <div class="column">
        <div class="column-header"><h2>Afgerond</h2><span class="count" id="count-done">0</span></div>
        <div class="task-list" id="list-done"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <p id="modal-text">Weet je het zeker?</p>
      <div class="modal-actions">
        <button class="btn-cancel" id="modal-cancel">Annuleer</button>
        <button class="btn-confirm" id="modal-confirm">Ja, verwijder</button>
      </div>
    </div>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('vh_tasks')) || [];
    const form = document.getElementById('task-form');
    const lists = { todo: document.getElementById('list-todo'), doing: document.getElementById('list-doing'), done: document.getElementById('list-done') };
    const counts = { todo: document.getElementById('count-todo'), doing: document.getElementById('count-doing'), done: document.getElementById('count-done') };
    const toast = document.getElementById('toast');
    const modal = document.getElementById('modal');
    const modalText = document.getElementById('modal-text');
    let pendingAction = null;

    function saveTasks(){ localStorage.setItem('vh_tasks', JSON.stringify(tasks)); }
    function showToast(msg, type='success'){
      toast.textContent = msg;
      toast.className = 'toast show ' + type;
      setTimeout(()=> toast.classList.remove('show'), 2500);
    }
    function askConfirm(msg, cb){
      modalText.textContent = msg; pendingAction = cb; modal.classList.add('show');
    }
    document.getElementById('modal-cancel').onclick = ()=>{ modal.classList.remove('show'); pendingAction=null; };
    document.getElementById('modal-confirm').onclick = ()=>{ modal.classList.remove('show'); if(pendingAction) pendingAction(); pendingAction=null; };

    function render(){
      lists.todo.innerHTML = ''; lists.doing.innerHTML = ''; lists.done.innerHTML = '';
      let cT=0, cD=0, cDone=0;

      tasks.forEach(task=>{
        let targetList;
        if(task.status==='todo'){ targetList=lists.todo; cT++; }
        else if(task.status==='doing'){ targetList=lists.doing; cD++; }
        else { targetList=lists.done; cDone++; }

        const card = document.createElement('div');
        card.className = 'task';
        let moveButtons = '';
        if(task.status==='todo') moveButtons = `<button class="btn-move" data-move="doing" data-id="${task.id}">Start →</button>`;
        else if(task.status==='doing') moveButtons = `<button class="btn-move" data-move="todo" data-id="${task.id}">← Terug</button><button class="btn-move" data-move="done" data-id="${task.id}">Voltooi ✓</button>`;
        else moveButtons = `<button class="btn-move" data-move="doing" data-id="${task.id}">← Heropen</button>`;

        card.innerHTML = `
          <h3>${task.name}</h3>
          <p>Klant: ${task.client}</p>
          <div class="task-actions">
            ${moveButtons}
            <button class="btn-move btn-delete" data-delete="${task.id}">Verwijder</button>
          </div>
        `;
        card.querySelectorAll('[data-move]').forEach(b=>{
          b.addEventListener('click', ()=> moveTask(task.id, b.dataset.move));
        });
        card.querySelector('[data-delete]').addEventListener('click', ()=>{
          askConfirm(`Project "${task.name}" verwijderen?`, ()=>{
            tasks = tasks.filter(t=>t.id!==task.id);
            saveTasks(); render(); showToast('Project verwijderd','success');
          });
        });
        targetList.appendChild(card);
      });
      counts.todo.textContent = cT;
      counts.doing.textContent = cD;
      counts.done.textContent = cDone;
    }

    form.addEventListener('submit', e=>{
      e.preventDefault();
      tasks.push({ id: Date.now(), name: document.getElementById('task-name').value.trim(), client: document.getElementById('task-client').value.trim(), status:'todo' });
      saveTasks(); form.reset(); render(); showToast('Project toegevoegd!','success');
    });

    function moveTask(id, newStatus){
      tasks = tasks.map(t => t.id===id ? {...t, status:newStatus} : t);
      saveTasks(); render();
    }

    render();
  </script>
</body>
</html>
