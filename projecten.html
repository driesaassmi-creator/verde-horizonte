<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Projecten – Verde Horizonte Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070d; 
    --surface: #0b1020; 
    --surface-2: #0f1630;
    --border: rgba(233, 237, 247, 0.09); 
    --text: #e9edf7;
    --muted: rgba(233, 237, 247, 0.58); 
    --accent: #5b8cff;
    --accent2: #4fd1ff; 
    --gold: #d4af37;
    --danger: #ff6b7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  /* VOORKOMT HORIZONTAAL SCROLLEN EN SWIPEN */
  html, body { 
    overflow-x: hidden; 
    overscroll-behavior-x: none; 
    touch-action: pan-y;
  }
  
  body {
    font-family: 'Inter', sans-serif; 
    background: var(--bg); 
    color: var(--text);
    min-height: 100vh; 
    padding: 30px 15px;
    background: radial-gradient(900px 420px at 50% -120px, rgba(91,140,255,.14), transparent 70%), var(--bg);
  }
  
  .container { max-width: 1100px; margin: 0 auto; }
  
  /* Header */
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
  .header h1 { font-size: 1.6rem; font-weight: 700; }
  .header h1 span { color: var(--gold); }
  .header a { 
    color: var(--text); 
    text-decoration: none; 
    font-size: 0.85rem; 
    background: var(--surface);
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  /* Formulier */
  .add-form { 
    display: flex; 
    gap: 10px; 
    margin-bottom: 30px; 
    background: var(--surface); 
    padding: 15px; 
    border-radius: 16px; 
    border: 1px solid var(--border); 
    flex-wrap: wrap;
  }
  .add-form input { 
    flex: 1; 
    min-width: 150px;
    padding: 14px; 
    background: var(--bg); 
    border: 1px solid var(--border); 
    color: var(--text); 
    border-radius: 10px; 
    font: inherit; 
  }
  .add-form input:focus { outline: none; border-color: var(--accent); }
  .btn-add { 
    padding: 14px 24px; 
    background: var(--accent); 
    color: #000; 
    font-weight: 600; 
    border: none; 
    border-radius: 10px; 
    cursor: pointer; 
    flex: 1;
    min-width: 100%;
  }
  .btn-add:hover { filter: brightness(1.1); }

  /* Kanban Board */
  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  
  .column { 
    background: var(--surface-2); 
    border-radius: 16px; 
    padding: 15px; 
    border: 1px solid var(--border); 
    min-height: 200px; 
  }
  .column-header { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    margin-bottom: 15px; 
    padding-bottom: 10px; 
    border-bottom: 1px solid var(--border); 
  }
  .column-header h2 { font-size: 0.9rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .count { background: rgba(91,140,255,.1); color: var(--accent); padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; font-weight: 700; }

  /* Kaartjes */
  .task-list { display: flex; flex-direction: column; gap: 12px; }
  .task { 
    background: var(--surface); 
    border: 1px solid var(--border); 
    padding: 15px; 
    border-radius: 12px; 
    transition: all 0.2s; 
  }
  .task:hover { border-color: rgba(91,140,255,.4); }
  .task h3 { font-size: 1rem; margin-bottom: 5px; }
  .task p { font-size: 0.85rem; color: var(--muted); margin-bottom: 15px; }
  
  .task-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-move { 
    padding: 8px 12px; 
    background: transparent; 
    border: 1px solid var(--border); 
    color: var(--text); 
    border-radius: 8px; 
    cursor: pointer; 
    font-size: 0.8rem; 
    flex: 1;
  }
  .btn-move:hover { background: rgba(91,140,255,.1); border-color: var(--accent); }
  .btn-delete { color: var(--danger); border-color: rgba(255,107,122,.3); flex: 0; }
  .btn-delete:hover { background: rgba(255,107,122,.1); border-color: var(--danger); }

  /* MOBIELE WEERGAVE: Alles netjes onder elkaar */
  @media(max-width: 768px) {
    .add-form { 
      flex-direction: column; 
    }
    .add-form input {
      width: 100%;
    }
    .btn-add {
      width: 100%;
      min-width: 100%;
    }
    .board { 
      grid-template-columns: 1fr; /* Kolommen onder elkaar */
      gap: 15px;
    }
    .column {
      min-height: auto;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Projecten <span>Tracker</span></h1>
      <a href="admin.html">← Terug</a>
    </div>

    <form class="add-form" id="task-form">
      <input type="text" id="task-name" placeholder="Projectnaam (bijv. Website Garage)" required>
      <input type="text" id="task-client" placeholder="Klantnaam" required>
      <button type="submit" class="btn-add">+ Toevoegen</button>
    </form>

    <div class="board">
      <div class="column">
        <div class="column-header"><h2>Te Doen</h2><span class="count" id="count-todo">0</span></div>
        <div class="task-list" id="list-todo"></div>
      </div>
      <div class="column">
        <div class="column-header"><h2>In Behandeling</h2><span class="count" id="count-doing">0</span></div>
        <div class="task-list" id="list-doing"></div>
      </div>
      <div class="column">
        <div class="column-header"><h2>Afgerond</h2><span class="count" id="count-done">0</span></div>
        <div class="task-list" id="list-done"></div>
      </div>
    </div>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('vh_tasks')) || [];
    const form = document.getElementById('task-form');
    const lists = { 
      todo: document.getElementById('list-todo'), 
      doing: document.getElementById('list-doing'), 
      done: document.getElementById('list-done') 
    };
    const counts = { 
      todo: document.getElementById('count-todo'), 
      doing: document.getElementById('count-doing'), 
      done: document.getElementById('count-done') 
    };

    function saveTasks() { 
      localStorage.setItem('vh_tasks', JSON.stringify(tasks)); 
    }

    function render() {
      lists.todo.innerHTML = ''; 
      lists.doing.innerHTML = ''; 
      lists.done.innerHTML = '';
      
      let countTodo = 0, countDoing = 0, countDone = 0;

      tasks.forEach(task => {
        let targetList;
        if (task.status === 'todo') { targetList = lists.todo; countTodo++; }
        else if (task.status === 'doing') { targetList = lists.doing; countDoing++; }
        else { targetList = lists.done; countDone++; }

        const card = document.createElement('div');
        card.className = 'task';
        
        let moveButtons = '';
        if (task.status === 'todo') { 
          moveButtons = `<button class="btn-move" onclick="moveTask(${task.id}, 'doing')">Start →</button>`; 
        } else if (task.status === 'doing') { 
          moveButtons = `
            <button class="btn-move" onclick="moveTask(${task.id}, 'todo')">← Terug</button>
            <button class="btn-move" onclick="moveTask(${task.id}, 'done')">Voltooi ✓</button>
          `; 
        } else if (task.status === 'done') { 
          moveButtons = `<button class="btn-move" onclick="moveTask(${task.id}, 'doing')">← Heropen</button>`; 
        }

        card.innerHTML = `
          <h3>${task.name}</h3>
          <p>Klant: ${task.client}</p>
          <div class="task-actions">
            ${moveButtons}
            <button class="btn-move btn-delete" onclick="deleteTask(${task.id})">Verwijder</button>
          </div>
        `;
        targetList.appendChild(card);
      });
      
      counts.todo.textContent = countTodo;
      counts.doing.textContent = countDoing;
      counts.done.textContent = countDone;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      tasks.push({ 
        id: Date.now(), 
        name: document.getElementById('task-name').value.trim(), 
        client: document.getElementById('task-client').value.trim(), 
        status: 'todo' 
      });
      saveTasks(); 
      form.reset(); 
      render();
    });

    function moveTask(id, newStatus) {
      tasks = tasks.map(t => t.id === id ? { ...t, status: newStatus } : t);
      saveTasks(); 
      render();
    }

    function deleteTask(id) {
      if(confirm('Weet je zeker dat je dit project wilt verwijderen?')) {
        tasks = tasks.filter(t => t.id !== id);
        saveTasks(); 
        render();
      }
    }
    
    // Start de app
    render();
  </script>
</body>
</html>
