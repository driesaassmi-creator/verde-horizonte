<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Uren Tracker – Verde Horizonte Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:20px}
  .card h2{font-size:1.1rem;margin-bottom:15px;font-weight:600}
  .form-row{display:flex;gap:15px;flex-wrap:wrap;margin-bottom:15px}
  .form-group{flex:1;min-width:150px}
  .btn-stop{background:var(--danger);color:#fff}
  .btn-stop:hover{filter:brightness(1.1)}

  .timer-display{font-size:3.5rem;font-weight:700;text-align:center;margin:20px 0;color:var(--accent2);font-variant-numeric:tabular-nums;letter-spacing:2px}
  .timer-active{background:rgba(91,140,255,.1);border:1px solid var(--accent);border-radius:16px;padding:20px;text-align:center}
  .timer-active p{color:var(--muted);margin-bottom:10px}

  .session-list{display:flex;flex-direction:column;gap:10px}
  .session-item{display:flex;justify-content:space-between;align-items:center;padding:15px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;flex-wrap:wrap;gap:10px}
  .session-info{display:flex;flex-direction:column;gap:4px}
  .session-project{font-weight:600;font-size:1rem}
  .session-meta{font-size:.85rem;color:var(--muted)}
  .session-right{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
  .session-duration{font-weight:700;color:var(--accent2);font-size:1.1rem}
  .session-amount{color:var(--success);font-weight:600}
  .empty-msg{text-align:center;color:var(--muted);padding:20px;font-style:italic}

  /* FIX VOOR HET LEGE VAK ONDERAAN */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(200%);
    background: var(--surface-2); border: 1px solid var(--accent); color: var(--text);
    padding: 14px 22px; border-radius: 12px; font-size: .95rem; font-weight: 500;
    box-shadow: 0 10px 30px rgba(0,0,0,.5); z-index: 9999; transition: transform .35s ease;
    max-width: 90vw; visibility: hidden; opacity: 0;
  }
  .toast.show { transform: translateX(-50%) translateY(0); visibility: visible; opacity: 1; }

  @media(max-width:600px){
    .form-row{flex-direction:column}
    .timer-display{font-size:2.8rem}
    .session-item{flex-direction:column;align-items:flex-start}
    .session-right{width:100%;justify-content:space-between;margin-top:10px}
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Uren Tracker</h1>
      <a href="admin.html">← Terug naar Admin</a>
    </div>

    <div class="card" id="start-card">
      <h2>Start een nieuwe sessie</h2>
      <div class="form-row">
        <div class="form-group"><label>Projectnaam</label><input type="text" id="project-name" placeholder="Website Garage"></div>
        <div class="form-group"><label>Klant</label><input type="text" id="client-name" placeholder="Mark"></div>
        <div class="form-group"><label>Uurtarief (€)</label><input type="number" id="hourly-rate" placeholder="75" value="75"></div>
      </div>
      <button class="btn btn-primary" id="start-btn">▶ Start Timer</button>
    </div>

    <div class="card timer-active" id="active-card" style="display:none;">
      <p>Bezig: <strong id="active-project"></strong> (<span id="active-client"></span>)</p>
      <div class="timer-display" id="timer-display">00:00:00</div>
      <button class="btn btn-stop" id="stop-btn">⏹ Stop Timer</button>
    </div>

    <div class="card">
      <h2>Recente Sessies</h2>
      <div class="session-list" id="session-list"></div>
      <div class="empty-msg" id="empty-msg">Nog geen sessies.</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let sessions = JSON.parse(localStorage.getItem('vh_sessions')) || [];
    let activeSession = JSON.parse(localStorage.getItem('vh_active_session')) || null;
    let timerInterval = null;

    const startCard = document.getElementById('start-card');
    const activeCard = document.getElementById('active-card');
    const timerDisplay = document.getElementById('timer-display');
    const sessionList = document.getElementById('session-list');
    const emptyMsg = document.getElementById('empty-msg');
    const toast = document.getElementById('toast');

    function saveSessions(){ localStorage.setItem('vh_sessions', JSON.stringify(sessions)); }
    function saveActive(){ localStorage.setItem('vh_active_session', JSON.stringify(activeSession)); }
    function showToast(msg, type='success'){
      toast.textContent = msg;
      toast.className = 'toast show ' + type;
      setTimeout(()=> toast.classList.remove('show'), 2500);
    }

    function formatTime(seconds){
      const h = Math.floor(seconds/3600).toString().padStart(2,'0');
      const m = Math.floor((seconds%3600)/60).toString().padStart(2,'0');
      const s = (seconds%60).toString().padStart(2,'0');
      return `${h}:${m}:${s}`;
    }

    function updateTimer(){
      if(!activeSession) return;
      const elapsed = Math.floor((Date.now() - activeSession.startTime)/1000);
      timerDisplay.textContent = formatTime(elapsed);
    }

    document.getElementById('start-btn').addEventListener('click', ()=>{
      const project = document.getElementById('project-name').value.trim();
      if(!project) return showToast('Vul een projectnaam in', 'error');
      activeSession = {
        project,
        client: document.getElementById('client-name').value.trim() || 'Onbekend',
        rate: parseFloat(document.getElementById('hourly-rate').value) || 75,
        startTime: Date.now()
      };
      saveActive();
      startCard.style.display = 'none';
      activeCard.style.display = 'block';
      document.getElementById('active-project').textContent = activeSession.project;
      document.getElementById('active-client').textContent = activeSession.client;
      updateTimer();
      timerInterval = setInterval(updateTimer, 1000);
      showToast('Timer gestart!', 'success');
    });

    document.getElementById('stop-btn').addEventListener('click', ()=>{
      if(!activeSession) return;
      const duration = Math.floor((Date.now() - activeSession.startTime)/1000);
      const amount = (duration/3600) * activeSession.rate;
      sessions.unshift({
        id: Date.now(), project: activeSession.project, client: activeSession.client,
        rate: activeSession.rate, startTime: activeSession.startTime, duration, amount
      });
      saveSessions();
      activeSession = null; saveActive();
      clearInterval(timerInterval);
      startCard.style.display = 'block';
      activeCard.style.display = 'none';
      document.getElementById('project-name').value = '';
      document.getElementById('client-name').value = '';
      renderSessions();
      showToast('Sessie opgeslagen!', 'success');
    });

    function renderSessions(){
      sessionList.innerHTML = '';
      if(sessions.length === 0){ emptyMsg.style.display='block'; return; }
      emptyMsg.style.display='none';
      sessions.forEach(s=>{
        const item = document.createElement('div');
        item.className = 'session-item';
        const date = new Date(s.startTime).toLocaleString('nl-BE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
        item.innerHTML = `
          <div class="session-info">
            <span class="session-project">${s.project} <span style="color:var(--muted);font-weight:400;">(${s.client})</span></span>
            <span class="session-meta">${date} • ${s.rate} €/u</span>
          </div>
          <div class="session-right">
            <span class="session-duration">${formatTime(s.duration)}</span>
            <span class="session-amount">€ ${s.amount.toFixed(2)}</span>
            <button class="btn-danger" data-id="${s.id}">Verwijder</button>
          </div>
        `;
        item.querySelector('[data-id]').addEventListener('click', ()=>{
          sessions = sessions.filter(x => x.id !== s.id);
          saveSessions(); renderSessions();
          showToast('Sessie verwijderd', 'success');
        });
        sessionList.appendChild(item);
      });
    }

    function restoreActive(){
      if(activeSession){
        startCard.style.display = 'none';
        activeCard.style.display = 'block';
        document.getElementById('active-project').textContent = activeSession.project;
        document.getElementById('active-client').textContent = activeSession.client;
        updateTimer();
        timerInterval = setInterval(updateTimer, 1000);
      }
    }

    renderSessions();
    restoreActive();
  </script>
</body>
</html>
