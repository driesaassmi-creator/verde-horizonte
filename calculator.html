<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Prijscalculator – Verde Horizonte Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:500px;margin:0 auto;}
  .form-group{margin-bottom:20px}
  .form-group label{font-weight:600;color:var(--text);margin-bottom:8px;display:block}
  
  .range-wrap { display: flex; align-items: center; gap: 15px; }
  input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; }
  .range-val { min-width: 40px; font-weight: 700; color: var(--accent); text-align: right; }

  .result-box {
    background: rgba(91,140,255,.1);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 24px;
    text-align: center;
    margin-top: 30px;
  }
  .result-box h3 { font-size: 1rem; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .result-price { font-size: 3rem; font-weight: 800; color: var(--text); line-height: 1; margin-bottom: 5px; }
  .result-price span { font-size: 1rem; color: var(--muted); font-weight: 500; }
  .result-desc { font-size: 0.85rem; color: var(--muted); margin-top: 15px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Prijscalculator</h1>
      <a href="admin.html">← Terug naar Admin</a>
    </div>

    <div class="card">
      <div class="form-group">
        <label>Aantal pagina's</label>
        <div class="range-wrap">
          <input type="range" id="pages" min="1" max="10" value="1" oninput="calc()">
          <span class="range-val" id="pages-val">1</span>
        </div>
      </div>

      <div class="form-group">
        <label>Design & Maatwerk niveau</label>
        <select id="design" onchange="calc()">
          <option value="1">Basis (Standaard template)</option>
          <option value="1.5">Medium (Maatwerk elementen)</option>
          <option value="2">High-End (Volledig uniek design & animaties)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Extra's</label>
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
          <input type="checkbox" id="seo" style="width:20px; height:20px; accent-color:var(--accent);" onchange="calc()">
          <label for="seo" style="margin:0; font-weight:400; cursor:pointer;">SEO Optimalisatie (+ €250)</label>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <input type="checkbox" id="copy" style="width:20px; height:20px; accent-color:var(--accent);" onchange="calc()">
          <label for="copy" style="margin:0; font-weight:400; cursor:pointer;">Copywriting / Teksten (+ €150)</label>
        </div>
      </div>

      <div class="result-box">
        <h3>Geschatte Prijs</h3>
        <div class="result-price" id="price">€ 799,-</div>
        <div class="result-desc">Dit is een indicatie. Voor een exacte prijs maken we graag een offerte op maat.</div>
      </div>
    </div>
  </div>

  <script>
    function calc() {
      const pages = parseInt(document.getElementById('pages').value);
      const designMult = parseFloat(document.getElementById('design').value);
      
      document.getElementById('pages-val').textContent = pages;

      // Basisprijs formule
      let basePrice = 799; // Startprijs
      
      // Extra pagina's kosten 150 euro per stuk (behalve de eerste)
      let extraPagesCost = (pages - 1) * 150;

      // Totaal voor pagina's en design
      let subTotal = (basePrice + extraPagesCost) * designMult;

      // Extra's
      if (document.getElementById('seo').checked) subTotal += 250;
      if (document.getElementById('copy').checked) subTotal += 150;

      // Weergeven
      const formatter = new Intl.NumberFormat('nl-BE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
      document.getElementById('price').textContent = formatter.format(subTotal);
    }

    // Initialiseer bij laden
    calc();
  </script>
</body>
</html>
